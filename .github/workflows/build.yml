name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Tasks-v1.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: משימות v1.${{ github.run_number }}
          body: |
            להורדה והתקנה: הורד את קובץ ה-APK למטה ופתח אותו בטלפון.
            Commit: ${{ github.sha }}
          files: Tasks-v1.${{ github.run_number }}.apk
          make_latest: true

      - name: Clean old failure reports
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-fail-' || true); do
            gh release delete "$t" --yes --cleanup-tag || true
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILURE" -A4 build.log | head -200 || true
            echo '---- tail ----'
            tail -60 build.log || true
            echo '```'
          } > fail.md
          gh release create "build-fail-${{ github.run_number }}" --prerelease --target "${{ github.sha }}" --title "Build failed #${{ github.run_number }}" --notes-file fail.md
